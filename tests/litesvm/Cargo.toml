[package]
name = "scope-litesvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
base64 = "0.21"
bincode = "1.3"
litesvm = "0.15.2"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
solana-account = "4.3"
solana-clock = "~3.1.1"
solana-compute-budget-interface = "~3.0"
solana-instruction = "3.4"
solana-instructions-sysvar = "4.0"
solana-keypair = "3.1.2"
solana-loader-v3-interface = { version = "8.0.1", features = ["serde"] }
solana-message = "4.2.4"
solana-pubkey = { version = "~4.2", features = ["rand"] }
solana-sdk-ids = "3.1"
solana-signer = "3.0.1"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-transaction = "4.1.5"
time = "=0.3.36"
